<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Dashboard read path: 58 ms → 2 ms per request</title>
  <desc id="d">7.5 MB cached row · local benchmark · real response shapes. Before: about 58 ms. After: 2.1 ms. Throughput, 8 threads (req/s): 17 → 470.</desc>
  <rect width="1200" height="630" rx="28" fill="#f8fafc"/>
  <rect x="1" y="1" width="1198" height="628" rx="27" fill="none" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="96" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" font-size="44" font-weight="700" fill="#0f172a">Dashboard read path: 58 ms → 2 ms per request</text>
  <text x="60" y="140" font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" fill="#475569">7.5 MB cached row · local benchmark · real response shapes</text>

  <g font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="60" y="226" font-size="26" font-weight="600" fill="#0f172a">Before</text>
    <rect x="200" y="196" width="31.3" height="44" fill="#f59e0b"/>
    <rect x="231.3" y="196" width="679.0" height="44" fill="#dc2626"/>
    <rect x="910.3" y="196" width="9.8" height="44" fill="#94a3b8"/>
    <text x="934.1" y="226" font-size="28" font-weight="700" fill="#0f172a">≈58 ms</text>
    <text x="239.3" y="224" font-size="20" font-weight="600" fill="#ffffff">json.loads 55.4</text>
    <rect x="200" y="252" width="14" height="14" fill="#f59e0b"/><text x="222" y="265" font-size="18" fill="#475569">SQLite read 2.6</text>

    <text x="60" y="346" font-size="26" font-weight="600" fill="#0f172a">After</text>
    <rect x="200" y="316" width="26.1" height="44" fill="#16a34a"/>
    <text x="240.1" y="346" font-size="28" font-weight="700" fill="#0f172a">≈2.1 ms</text>
    <text x="356.1" y="346" font-size="22" font-weight="700" fill="#16a34a">27× faster</text>
    <text x="200" y="388" font-size="18" fill="#475569">stamp check 1.8 + parse 0.4</text>

    <text x="60" y="450" font-size="24" font-weight="600" fill="#0f172a">Throughput, 8 threads (req/s)</text>
    <rect x="200" y="468" width="26.5" height="30" fill="#dc2626"/>
    <text x="238.5" y="491" font-size="24" font-weight="700" fill="#0f172a">17</text>
    <rect x="200" y="508" width="719.5" height="30" fill="#16a34a"/>
    <text x="931.5" y="531" font-size="24" font-weight="700" fill="#0f172a">470</text>
    <text x="60" y="491" font-size="20" fill="#475569">Before</text>
    <text x="60" y="531" font-size="20" fill="#475569">After</text>

    <text x="60" y="596" font-size="22" fill="#334155">Byte-identical responses · worker untouched · cache strategy unchanged</text>
  </g>
</svg>
